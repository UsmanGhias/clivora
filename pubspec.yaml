name: clivora
description: CLIVORA - Business Operating System for Freelancers and Agencies
publish_to: 'none'
version: 2.1.0+25

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  google_sign_in: ^6.3.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
