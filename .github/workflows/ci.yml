name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Analyze the whole package, and treat infos as failures. Previously this
      # ran `analyze lib/ --no-fatal-infos`, which reported 97 issues and passed
      # anyway, so the gate enforced nothing.
      - run: flutter analyze
      - run: flutter test
