name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Analyze the whole package, and treat infos as failures. Previously this
      # ran `analyze lib/ --no-fatal-infos`, which reported 97 issues and passed
      # anyway, so the gate enforced nothing.
      - run: flutter analyze
      - run: flutter test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Must satisfy web/package.json engines (">=20 <23"). CI was on 24.x,
          # i.e. testing on a runtime the package declares unsupported.
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
