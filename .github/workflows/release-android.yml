name: Signed Android release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-playstore"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to current main
        run: |
          git fetch origin main --depth=1
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          tag_version="${GITHUB_REF_NAME%-playstore}"
          file_version="$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)"
          test "$tag_version" = "v$file_version"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Configure Android SDK paths
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> android/local.properties

      - name: Resolve dependencies and verify quality
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build and verify signed APK/AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: BUILD_AAB=1 ./build-android.sh

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            releases/clivora-*.apk \
            releases/clivora-*.aab \
            releases/SHA256SUMS.txt \
            --verify-tag \
            --title "CLIVORA $GITHUB_REF_NAME" \
            --generate-notes
